  Minimal static page used for a REAL browser-level CORS check.

  It must be served from a HOST DIFFERENT from the app under test (e.g. a small nginx/http.server
  sidecar exposed on its own hostname/port in the branch/nightly test environment - the same idea
  as the "SAML-fake-branch-testing" fake IdP used for SAML SSO tests).

  Usage: open this page as
      https://<some-other-host>/cors-probe.html?target=<app-url-to-call>
  It performs a cross-origin fetch() to "target" and writes the outcome into #result:
      "CORS_OK"      - browser could read the response (server sent proper CORS headers)
      "CORS_BLOCKED" - browser refused to expose the response (no/incorrect CORS headers)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Probe</title>
</head>
<body>
<div id="result">PENDING</div>

<script>
    const target = new URLSearchParams(window.location.search).get("target");
    const result = document.getElementById("result");

    if (!target) {
        result.textContent = "ERROR";
    } else {
        fetch(target, {
            method: "GET",
            credentials: "include"
        })
            .then(() => {
                result.textContent = "CORS_ALLOWED";
            })
            .catch(() => {
                result.textContent = "CORS_BLOCKED";
            });
    }
</script>
</body>
</html>
